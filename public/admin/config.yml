                  - { name: q, label: Question, widget: string }
                  - { name: r, label: Réponse, widget: text, hint: "**mots** = gras · *mots* = en couleur · [texte](/adresse) = lien · un retour à la ligne est gardé. Les espaces avant « : ? ! » se posent toutes seules." }

          - name: cloture
            label: 9. Clôture
            widget: object
            collapsed: true
            fields:
              - { name: surtitre, widget: string, label: Surtitre, hint: "Petit texte en capitales au-dessus du titre." }
              - { name: titre, widget: string, label: "Titre — première phrase" }
              - { name: titreAccent, widget: string, label: "Titre — phrase en couleur", hint: "S'affiche en couleur, à la suite de la première phrase." }
              - { name: texte, label: Paragraphe, widget: text, hint: "**mots** = gras · *mots* = en couleur · [texte](/adresse) = lien · un retour à la ligne est gardé. Les espaces avant « : ? ! » se posent toutes seules." }
