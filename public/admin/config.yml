              - name: entreprise
                label: Carte de couleur — entreprise
                widget: object
                fields:
                  - { name: etiquette, label: Petite ligne en capitales, widget: string }
                  - { name: titre, label: Titre, widget: string }
                  - { name: texte, label: Texte, widget: text, hint: "**mots** = gras · *mots* = en couleur · [texte](/adresse) = lien · un retour à la ligne est gardé. Les espaces avant « : ? ! » se posent toutes seules." }
