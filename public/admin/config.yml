              - { name: surtitreSuite, label: "Surtitre — suite (cachée sur téléphone)", widget: string }
              - { name: titre1, label: "Grand titre — ligne 1, début", widget: string, hint: "Titre calé ligne par ligne : deux lignes sur ordinateur, quatre sur téléphone. Garder des longueurs proches." }
              - { name: titre2, label: "Grand titre — ligne 1, fin", widget: string }
              - { name: titreAccent1, label: "Grand titre — ligne 2 en couleur, début", widget: string }
              - { name: titreAccent2, label: "Grand titre — ligne 2 en couleur, fin", widget: string }
              - { name: chapo, label: Paragraphe, widget: text, hint: "**mots** = gras · *mots* = en couleur · [texte](/adresse) = lien · un retour à la ligne est gardé. Les espaces avant « : ? ! » se posent toutes seules." }
              - { name: lienDossier, label: "Second bouton (vers « Comment ça se passe »)", widget: string }
              - { name: mention, label: Petite ligne sous les boutons, widget: string }

