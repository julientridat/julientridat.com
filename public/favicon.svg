<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!--
    Favicon à la charte « planning » (novembre 2026) : angles droits, fond d'encre
    #101214, neuf points dans le vert « sur sombre » #7FD3AE (contraste suffisant à
    16 px). Remplace la version violette arrondie de l'ancienne identité, que Google
    affichait encore dans ses résultats. Format 48 × 48 : Google demande un multiple de 48.
  -->
  <rect width="48" height="48" fill="#101214"/>
  <g fill="#7FD3AE">
    <rect x="8" y="8" width="8" height="8"/>
    <rect x="20" y="8" width="8" height="8"/>
    <rect x="32" y="8" width="8" height="8"/>
    <rect x="8" y="20" width="8" height="8"/>
    <rect x="20" y="20" width="8" height="8"/>
    <rect x="32" y="20" width="8" height="8"/>
    <rect x="8" y="32" width="8" height="8"/>
    <rect x="20" y="32" width="8" height="8"/>
    <rect x="32" y="32" width="8" height="8"/>
  </g>
</svg>
